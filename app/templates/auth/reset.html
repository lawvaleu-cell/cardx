{% extends "base.html" %}
{% block title %}{{ 'إعادة تعيين كلمة المرور' if locale=='ar' else 'Reset password' }} — CardX{% endblock %}
{% block content %}
<div class="auth-shell">
  <div class="auth-box fade-up">
    <div class="card-surface">
      <h2 style="margin-bottom:20px;">{{ 'كلمة مرور جديدة' if locale=='ar' else 'Choose a new password' }}</h2>
      <form method="post">
        <div class="field">
          <label>{{ 'كلمة المرور الجديدة' if locale=='ar' else 'New password' }}</label>
          <input type="password" name="password" required minlength="6" autofocus>
        </div>
        <button type="submit" class="btn btn-primary btn-block">{{ 'حفظ' if locale=='ar' else 'Save' }}</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
