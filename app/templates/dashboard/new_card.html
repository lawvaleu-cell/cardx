{% extends "dashboard/_shell.html" %}
{% block title %}{{ t('create_card') }} — CardX{% endblock %}
{% block page_title %}{{ t('create_card') }}{% endblock %}
{% block dash_content %}
<form method="post" class="panel" style="max-width:640px;">
  <div class="field">
    <label>{{ 'الاسم الأول' if locale=='ar' else 'First name' }}</label>
    <input type="text" name="first_name" required>
  </div>
  <div class="field">
    <label>{{ 'اسم العائلة' if locale=='ar' else 'Last name' }}</label>
    <input type="text" name="last_name">
  </div>
  <div class="form-row">
    <div class="field"><label>{{ 'المسمى الوظيفي' if locale=='ar' else 'Job title' }}</label><input type="text" name="job_title"></div>
    <div class="field"><label>{{ 'الشركة' if locale=='ar' else 'Company' }}</label><input type="text" name="company"></div>
  </div>
  <div class="field">
    <label>{{ 'اسم المستخدم (الرابط)' if locale=='ar' else 'Username (URL)' }}</label>
    <input type="text" name="username" placeholder="e.g. ahmedbenali">
    <div class="hint">cardx.local/c/<span id="unamePreview">username</span></div>
  </div>
  <div class="field">
    <label>{{ 'اختر قالبًا' if locale=='ar' else 'Choose a template' }}</label>
    <div class="template-pick-grid">
      {% for tpl in templates %}
      <label class="template-pick {{ 'selected' if loop.first }}">
        <input type="radio" name="template" value="{{ tpl.slug }}" {{ 'checked' if loop.first }} style="display:none;" onclick="document.querySelectorAll('.template-pick').forEach(e=>e.classList.remove('selected'));this.closest('.template-pick').classList.add('selected');">
        <div class="tp-dot" style="background:{{ tpl.primary_color }};{% if tpl.bg_color.startswith('gradient') %}background:linear-gradient(135deg,{{tpl.primary_color}},{{tpl.accent_color}});{% endif %}"></div>
        <span>{{ tpl.name }}</span>
      </label>
      {% endfor %}
    </div>
  </div>
  <button type="submit" class="btn btn-primary btn-block" style="margin-top:10px;">{{ 'إنشاء البطاقة والمتابعة للمحرر' if locale=='ar' else 'Create card and open builder' }} →</button>
</form>
{% endblock %}
{% block extra_js %}
<script>
document.querySelector('input[name="first_name"]').addEventListener('input', function(){
  document.getElementById('unamePreview').textContent = this.value.toLowerCase().replace(/[^a-z0-9]/g,'') || 'username';
});
const params = new URLSearchParams(window.location.search);
const preselect = params.get('template');
if (preselect) {
  document.querySelectorAll('.template-pick').forEach(e=>e.classList.remove('selected'));
  const el = document.querySelector(`input[value="${preselect}"]`);
  if (el) { el.checked = true; el.closest('.template-pick').classList.add('selected'); }
}
</script>
{% endblock %}
